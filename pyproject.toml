[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantage"
version = "0.1.0"
description = "A private executive AI system that answers only from your data — with file, version, page and data-date on every fact."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "psycopg[binary]",
    "pgvector",
    "pypdf",
    "numpy",
    # Policy lives in versioned YAML so access rules are reviewable in git.
    "pyyaml",
    # Thai word segmentation. Postgres FTS ('simple' config) cannot tokenise a
    # language without spaces, so BM25 needs real segmentation at ingest time.
    "pythainlp",
    # Synthetic-dataset generation (Thai PDFs + spreadsheets).
    "reportlab",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    # Embedded Postgres + pgvector for the DB-backed tests — no Docker needed.
    "pgserver",
]
# Frontier API model for generation (the default generation route).
api = [
    "anthropic",
]
# Local cross-encoder reranker (bge-reranker-v2-m3). Heavy — pulls torch.
rerank = [
    "sentence-transformers",
]

[project.scripts]
vantage-dataset = "scripts.gen_dataset:main"
vantage-ingest = "scripts.ingest:main"
vantage-eval = "scripts.run_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
